<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380"
     role="img" aria-label="A white cat holding a CTF flag before Mt Fuji at sunrise, a torii gate and a sakura branch, cherry-blossom petals drifting over a stylised sea">
  <title>CTF-Brain</title>

  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1e2a38"/>
    </pattern>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0"    stop-color="#ff7a5c"/>
      <stop offset="0.55" stop-color="#e2574c"/>
      <stop offset="1"    stop-color="#e2574c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fuji" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22323f"/>
      <stop offset="1" stop-color="#0f1a24"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0b0f14" stop-opacity="0"/>
      <stop offset="1"   stop-color="#0b0f14" stop-opacity="0.55"/>
    </linearGradient>
    <path id="ray" d="M-16 0 L16 0 L0 -620 Z"/>
    <path id="petal"
          d="M0 0 C -5 -6 -4.6 -14.5 0 -18.5 C 1.3 -16 1.3 -16 0 -14.6
             C -1.3 -16 -1.3 -16 0 -18.5 C 4.6 -14.5 5 -6 0 0 Z"/>
    <g id="blossom">
      <g fill="#f7bcd6" stroke="#e98cb6" stroke-width="0.5">
        <use href="#petal" transform="rotate(0)   scale(0.66)"/>
        <use href="#petal" transform="rotate(72)  scale(0.66)"/>
        <use href="#petal" transform="rotate(144) scale(0.66)"/>
        <use href="#petal" transform="rotate(216) scale(0.66)"/>
        <use href="#petal" transform="rotate(288) scale(0.66)"/>
      </g>
      <g fill="#ffd76a">
        <circle cx="0"   cy="-5"  r="0.9"/><circle cx="4.8" cy="-1.5" r="0.9"/>
        <circle cx="3"   cy="4"   r="0.9"/><circle cx="-3"  cy="4"   r="0.9"/>
        <circle cx="-4.8" cy="-1.5" r="0.9"/>
      </g>
      <circle r="1.9" fill="#fff1f7"/>
    </g>
    <clipPath id="frame"><rect width="1200" height="380" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="#0b0f14"/>
    <rect width="1200" height="380" fill="url(#grid)" opacity="0.55"/>

    <!-- rising-sun rays -->
    <g transform="translate(600,124)" opacity="0.06" fill="#e2574c">
      <use href="#ray"/><use href="#ray" transform="rotate(30)"/>
      <use href="#ray" transform="rotate(60)"/><use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(120)"/><use href="#ray" transform="rotate(150)"/>
      <use href="#ray" transform="rotate(180)"/><use href="#ray" transform="rotate(210)"/>
      <use href="#ray" transform="rotate(240)"/><use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(300)"/><use href="#ray" transform="rotate(330)"/>
    </g>

    <!-- hinomaru sun -->
    <circle cx="600" cy="124" r="112" fill="url(#sun)"/>
    <circle cx="600" cy="124" r="96"  fill="none" stroke="#ff8a70" stroke-opacity="0.5" stroke-width="1.5"/>

    <!-- soft cloud streaks -->
    <g stroke="#dfe7ef" stroke-opacity="0.07" stroke-width="6" stroke-linecap="round">
      <path d="M150 150 h150"/><path d="M980 96 h130"/><path d="M120 210 h90"/>
    </g>

    <!-- Mt Fuji (offset left so its snowy peak clears the cat) -->
    <path d="M287 302 Q 385 172 515 90 Q 645 172 743 302 Z" fill="url(#fuji)"/>
    <path d="M515 90 Q 585 128 620 186" fill="none" stroke="#33475a" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- snow cap -->
    <path d="M413 176 L515 90 L617 176
             L607 185 597 175 587 185 577 175 567 185 557 175 547 186 537 175 527 185
             517 176 507 185 497 175 487 185 477 175 467 185 457 175 447 185 437 175 427 185 417 177 Z"
          fill="#e6edf4"/>
    <path d="M413 176 L515 90 L617 176" fill="none" stroke="#bcd4ea" stroke-width="1.2" stroke-opacity="0.7"/>

    <!-- torii gate -->
    <g>
      <path d="M1016 314 V200 M1120 314 V200" stroke="#e2574c" stroke-width="10"/>
      <path d="M998 200 C 1044 191 1092 191 1138 200 L1138 210
               C 1092 200 1044 200 998 210 Z" fill="#e2574c"/>
      <path d="M1022 228 H1114" stroke="#e2574c" stroke-width="7"/>
      <path d="M1068 210 V228" stroke="#e2574c" stroke-width="5"/>
    </g>

    <!-- sakura branch, top-left -->
    <g>
      <path d="M-8 6 C 78 26 150 34 206 84 C 236 110 248 146 246 176"
            fill="none" stroke="#4a3730" stroke-width="6" stroke-linecap="round"/>
      <path d="M118 34 C 150 34 172 56 178 90" fill="none" stroke="#4a3730" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M206 84 C 230 78 252 86 272 78" fill="none" stroke="#4a3730" stroke-width="2.8" stroke-linecap="round"/>
      <use href="#blossom" transform="translate(20,20)  scale(0.9) rotate(-18)"/>
      <use href="#blossom" transform="translate(74,34)  scale(1.15) rotate(12)"/>
      <use href="#blossom" transform="translate(126,40) scale(1.0)  rotate(-8)"/>
      <use href="#blossom" transform="translate(178,90) scale(1.2)  rotate(20)"/>
      <use href="#blossom" transform="translate(210,84) scale(0.85) rotate(-14)"/>
      <use href="#blossom" transform="translate(272,76) scale(0.8)  rotate(24)"/>
      <use href="#blossom" transform="translate(246,176) scale(1.05) rotate(6)"/>
      <use href="#blossom" transform="translate(96,72)  scale(0.6)  rotate(40)"/>
    </g>

    <!-- petals drifting (behind the cat) -->
    <g>
      <use href="#petal" transform="translate(360,120) rotate(28)  scale(1.0)" fill="#f6a5c6" opacity="0.9"/>
      <use href="#petal" transform="translate(452,60)  rotate(-40) scale(0.8)" fill="#f9c2d8" opacity="0.85"/>
      <use href="#petal" transform="translate(520,150) rotate(70)  scale(0.7)" fill="#ef8fb6" opacity="0.8"/>
      <use href="#petal" transform="translate(760,70)  rotate(-25) scale(0.95)" fill="#f6a5c6" opacity="0.9"/>
      <use href="#petal" transform="translate(840,150) rotate(50)  scale(0.75)" fill="#fbd0e0" opacity="0.8"/>
      <use href="#petal" transform="translate(930,230) rotate(-60) scale(0.85)" fill="#f6a5c6" opacity="0.85"/>
      <use href="#petal" transform="translate(1040,150) rotate(15) scale(0.9)" fill="#f9c2d8" opacity="0.85"/>
      <use href="#petal" transform="translate(700,235) rotate(120) scale(0.7)" fill="#ef8fb6" opacity="0.75"/>
      <use href="#petal" transform="translate(320,240) rotate(-15) scale(0.8)" fill="#fbd0e0" opacity="0.8"/>
    </g>

    <!-- flag pole (behind the holding paw) -->
    <path d="M650 306 V150" stroke="#aab6c4" stroke-width="4" stroke-linecap="round"/>
    <circle cx="650" cy="148" r="5" fill="#aab6c4"/>
    <!-- pennant -->
    <path d="M652 154 L 730 175 L 652 196 Z" fill="#4fc3f7"/>
    <path d="M652 154 L 730 175" stroke="#8fd6f7" stroke-width="1.5"/>
    <path d="M664 169 h30 M664 179 h40" stroke="#0b0f14" stroke-opacity="0.4"
          stroke-width="2.4" stroke-linecap="round"/>

    <!-- cat -->
    <g transform="translate(342,14)">
      <path d="M312 266 C 356 274, 372 234, 354 200" fill="none" stroke="#e8eef5"
            stroke-width="13" stroke-linecap="round"/>
      <path d="M204 286 C 198 234, 212 204, 258 200 C 304 204, 318 234, 312 286 Z" fill="#e8eef5"/>
      <path d="M226 156 L 219 113 L 253 142 Z" fill="#e8eef5"/>
      <path d="M290 156 L 297 113 L 263 142 Z" fill="#e8eef5"/>
      <path d="M231 150 L 227 126 L 246 143 Z" fill="#e2574c"/>
      <path d="M285 150 L 289 126 L 270 143 Z" fill="#e2574c"/>
      <circle cx="258" cy="174" r="45" fill="#e8eef5"/>
      <ellipse cx="241" cy="170" rx="5.5" ry="9.5" fill="#0b0f14"/>
      <ellipse cx="275" cy="170" rx="5.5" ry="9.5" fill="#0b0f14"/>
      <circle cx="242.6" cy="166.5" r="2.1" fill="#4fc3f7"/>
      <circle cx="276.6" cy="166.5" r="2.1" fill="#4fc3f7"/>
      <path d="M253 189 L 263 189 L 258 194.5 Z" fill="#e2574c"/>
      <path d="M258 195 C 254 200.5, 247.5 200.5, 244.5 196.5
               M258 195 C 262 200.5, 268.5 200.5, 271.5 196.5"
            fill="none" stroke="#0b0f14" stroke-width="1.7" stroke-linecap="round"/>
      <g stroke="#0b0f14" stroke-width="1.3" stroke-linecap="round" opacity="0.5">
        <path d="M214 180 H 234 M216 190 H 235 M302 180 H 282 M300 190 H 281"/>
      </g>
      <path d="M231 212 C 246 220, 270 220, 285 212" fill="none" stroke="#ffb74d"
            stroke-width="6" stroke-linecap="round"/>
      <circle cx="258" cy="219" r="6.5" fill="#ffb74d"/>
      <ellipse cx="215" cy="278" rx="17" ry="10" fill="#dfe7ef"/>
      <ellipse cx="301" cy="278" rx="17" ry="10" fill="#dfe7ef"/>
    </g>
    <!-- raised paw gripping the pole -->
    <path d="M636 250 C 648 232 652 214 650 198" fill="none" stroke="#e8eef5"
          stroke-width="13" stroke-linecap="round"/>
    <circle cx="650" cy="197" r="8.5" fill="#e8eef5"/>
    <!-- a petal resting on the cat's head -->
    <use href="#petal" transform="translate(582,150) rotate(34) scale(0.8)" fill="#f6a5c6"/>

    <!-- petals drifting (in front) -->
    <g>
      <use href="#petal" transform="translate(500,250) rotate(-30) scale(0.85)" fill="#f9c2d8" opacity="0.9"/>
      <use href="#petal" transform="translate(880,110) rotate(60) scale(0.7)" fill="#f6a5c6" opacity="0.85"/>
      <use href="#petal" transform="translate(1090,250) rotate(-50) scale(0.8)" fill="#ef8fb6" opacity="0.85"/>
    </g>

    <!-- sea -->
    <g>
      <path d="M-20 300 C 120 272, 250 312, 380 300 C 520 287, 640 318, 780 306
               C 920 294, 1060 320, 1220 300 L1220 400 L-20 400 Z" fill="#14384a"/>
      <path d="M-20 334 C 140 310, 260 350, 400 334 C 540 318, 660 350, 800 338
               C 940 326, 1080 352, 1220 332 L1220 400 L-20 400 Z" fill="#0e2733"/>
      <g fill="none" stroke="#4fc3f7" stroke-linecap="round">
        <path d="M58 300 C 82 270, 124 264, 150 283 C 130 268, 100 270, 80 287"
              stroke-width="3" stroke-opacity="0.55"/>
        <path d="M150 283 C 161 274, 174 274, 181 283" stroke-width="2.4" stroke-opacity="0.32"/>
        <path d="M618 310 C 640 286, 676 282, 696 298 C 680 286, 654 288, 638 300"
              stroke-width="3" stroke-opacity="0.34"/>
        <path d="M1004 304 C 1024 284, 1052 281, 1070 294" stroke-width="2.4" stroke-opacity="0.24"/>
      </g>
      <g fill="#4fc3f7" opacity="0.3">
        <circle cx="154" cy="278" r="2.6"/><circle cx="183" cy="281" r="2"/>
        <circle cx="700" cy="294" r="2.3"/><circle cx="1074" cy="291" r="2"/>
      </g>
    </g>

    <rect width="1200" height="380" fill="url(#sky)" opacity="0.5"/>
    <rect x="0.5" y="0.5" width="1199" height="379" rx="14" fill="none" stroke="#1e2a38"/>
  </g>
</svg>
